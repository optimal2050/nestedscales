# The intro (vignettes/nestedscales.Rmd, package-named) surfaces as
# "Get started" on its own. The other vignettes and the online-only articles
# (vignettes/articles/, build-ignored) sit in the Articles dropdown.
navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, python, github, lightswitch]
  components:
    python:
      text: Python
      href: ../python/

