[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nestedscales"
dynamic = ["version"]
description = "Nested scales and multi-dimensional indexes for modeling"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["nested scales", "hierarchy", "aggregation", "classification", "modeling"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
authors = [{ name = "Oleg Lugovoy", email = "olugovoy@optimalsolution.dev" }]
dependencies = [
  "pyarrow>=14",
  "numpy>=1.23",
  "pyyaml>=6",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
pandas = ["pandas>=2.2"]
test = ["pytest>=8", "hypothesis>=6"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/optimal2050/nestedscales"
Documentation = "https://optimal2050.github.io/nestedscales/python/"
Repository = "https://github.com/optimal2050/nestedscales"
Issues = "https://github.com/optimal2050/nestedscales/issues"

[tool.hatch.version]
path = "src/nestedscales/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nestedscales"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::nestedscales.NestedScalesWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Messages are ported verbatim from R sprintf() calls, so %-formatting stays.
ignore = ["UP031"]
